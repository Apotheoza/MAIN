<div class="apotheoza-duomedia-right-wrapper is-fixed">
  <div class="apotheoza-v-line-left"></div>

  <!-- Above media 3: Halo 3D cylindrical text from text1.txt (tilted down) -->
  <div class="apotheoza-cylinder-section">
    <div class="apotheoza-halo-scene down" id="cylinderWrapTop"></div>
  </div>

  <!-- Media 3 (centered vertically, enlarged, evenly cut off left/right) -->
  <div class="apotheoza-media-box apotheoza-media-box-right" id="duoSlot3">
    <video autoplay loop muted playsinline class="apotheoza-media-img" src="/api/user/{{USERNAME}}/raw?path=info/modules/media3.mp4"></video>
  </div>

  <!-- Below media 3: Halo 3D cylindrical text from text2.txt (tilted up) -->
  <div class="apotheoza-cylinder-section">
    <div class="apotheoza-halo-scene up" id="cylinderWrapBottom"></div>
  </div>
</div>

<script>
(function() {
  async function setupHaloCylinder(sceneId, filePaths, defaultWords) {
    const scene = document.getElementById(sceneId);
    if (!scene) return;

    let words = defaultWords;
    for (const p of filePaths) {
      try {
        const res = await fetch(p);
        if (res.ok) {
          const raw = await res.text();
          const lines = raw.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
          if (lines.length > 0) {
            words = lines;
            break;
          }
        }
      } catch (e) {}
    }

    scene.innerHTML = '';
    const flankWidth = scene.clientWidth || scene.parentElement?.clientWidth || 360;
    const radius = Math.min(180, Math.max(120, Math.round(flankWidth * 0.44)));

    // Ensure exactly 5 rows for a rich, dense cylinder stack
    let fiveRows = [...words];
    while (fiveRows.length < 5) {
      fiveRows = fiveRows.concat(words);
    }
    fiveRows = fiveRows.slice(0, 5);

    fiveRows.forEach((word) => {
      const row = document.createElement('div');
      row.className = 'apotheoza-halo-row';

      const cylinder = document.createElement('div');
      cylinder.className = 'apotheoza-halo-cylinder';

      let baseStr = word.trim();
      if (!baseStr.endsWith(' ') && !baseStr.endsWith('•') && !baseStr.endsWith('-')) {
        baseStr += '  ';
      } else {
        baseStr += ' ';
      }

      // Denser glyph packing around the circumference
      const targetCount = 100;
      const repeatCount = Math.max(2, Math.ceil(targetCount / baseStr.length));
      const fullText = baseStr.repeat(repeatCount);
      const chars = fullText.split('');
      const n = chars.length;

      chars.forEach((ch, i) => {
        const span = document.createElement('span');
        span.className = 'apotheoza-halo-glyph';
        span.textContent = ch === ' ' ? '\u00A0' : ch;
        const angle = (360 / n) * i;
        span.style.transform = `rotateY(${angle}deg) translateZ(${radius}px) translate(-50%, -50%)`;
        cylinder.appendChild(span);
      });

      row.appendChild(cylinder);
      scene.appendChild(row);
    });
  }

  const defaultTop = ["HELLO WORLD", "TUBULAR TEXT", "EASY TO EDIT"];
  const defaultBottom = ["APOTHEOZA", "TREE ARCHIVE", "ROTATING TEXT"];

  function run() {
    const userMatch = window.location.pathname.match(/\/user\/([^\/]+)/);
    const user = userMatch ? decodeURIComponent(userMatch[1]) : '{{USERNAME}}';

    setupHaloCylinder('cylinderWrapTop', [
      `/api/user/${encodeURIComponent(user)}/raw?path=info/modules/text1.txt`,
      `/api/user/${encodeURIComponent(user)}/raw?path=info/text1.txt`
    ], defaultTop);

    setupHaloCylinder('cylinderWrapBottom', [
      `/api/user/${encodeURIComponent(user)}/raw?path=info/modules/text2.txt`,
      `/api/user/${encodeURIComponent(user)}/raw?path=info/text2.txt`
    ], defaultBottom);
  }

  run();
  window.initApotheozaRightCylinders = run;
})();
</script>
<img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg'/>" style="display:none;" onload="if(window.initApotheozaRightCylinders) window.initApotheozaRightCylinders();" />
