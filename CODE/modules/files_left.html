<div class="module-files-flank">
  <div class="card">
    <div class="card-header" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
      <h3 class="card-title" style="font-size:13px;">FILES {{ADD_FILE_BUTTON}}</h3>
      <select id="fileSortSelect" onchange="changeFileSort(this.value)" style="background:var(--bg-tertiary); color:var(--text-primary); border:1px solid var(--border-color); padding:2px 4px; font-family:inherit; font-size:10px; cursor:pointer;">
        <option value="size">Size</option>
        <option value="alpha">Alphabetical</option>
        <option value="date">Date Modified</option>
        <option value="liked">Most Liked</option>
      </select>
    </div>
    <div id="fileTree" class="file-tree" style="max-height:400px; overflow-y:auto;">Loading...</div>
  </div>
</div>
